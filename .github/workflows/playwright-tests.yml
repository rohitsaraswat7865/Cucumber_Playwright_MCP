name: Playwright Tests

on:
  push:
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    container:
      image: docker:24.0.7
      options: --privileged
    services:
      docker:
        image: docker:24.0.7-dind
        options: --privileged
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker access
        run: docker info

      - name: Build Playwright image
        run: docker build -t my-playwright-image .

      - name: Run Playwright tests in container
        run: |
          mkdir -p playwright-report test-results docker-logs
          docker run --rm \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            -v "${{ github.workspace }}/docker-logs:/app/docker-logs" \
            my-playwright-image

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            docker-logs/
          if-no-files-found: warn
          retention-days: 7
